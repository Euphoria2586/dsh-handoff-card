name: Publish verified source
on:
  push:
    branches: [main]
    paths: ['.release-source.zip', '.github/workflows/import-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: initial-source-import
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Euphoria2586/dsh-handoff-card' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify the prepared bundle and restore its exact file layout
        shell: python
        run: |
          from pathlib import Path, PurePosixPath
          import hashlib, json, zipfile
          bundle = Path('.release-source.zip')
          assert hashlib.sha256(bundle.read_bytes()).hexdigest() == '9eb8ffeba51cfb8d6a9a5284a9556c65442223fd502468f7ca345738eb84364b'
          expected = ['.gitignore', 'CHANGELOG.md', 'LAUNCH.md', 'LICENSE', 'README.md', 'README.zh-CN.md', 'cli.mjs', 'docs/assets/gallery-desktop.png', 'docs/assets/gallery-mobile.png', 'docs/assets/share-card.svg', 'docs/assets/zh-desktop.png', 'docs/assets/zh-mobile.png', 'examples/card.json', 'manifest.json', 'package.json', 'plugin.mjs', 'scripts/browser-smoke.mjs', 'setup.mjs', 'src/engine.mjs', 'test/engine.test.mjs', 'test/history.test.mjs', 'test/roundtrip.test.mjs', 'test/server.test.mjs', 'web/app.mjs', 'web/index.html', 'web/style.css']
          with zipfile.ZipFile(bundle) as archive:
              assert archive.testzip() is None
              assert sorted(archive.namelist()) == expected
              for item in archive.infolist():
                  rel = PurePosixPath(item.filename)
                  assert not rel.is_absolute() and '..' not in rel.parts
                  assert not any(p in {'.git', 'node_modules', '.tmp', '.codex', '.agents'} or p.startswith('.env') for p in rel.parts)
                  assert item.file_size <= 5 * 1024 * 1024
                  assert (item.external_attr >> 16) & 0o170000 != 0o120000
              archive.extractall('.')
          assert json.loads(Path('package.json').read_text())['name'] == 'dsh-handoff-card'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test standalone source on Node 22
        run: |
          node --test
          node cli.mjs --help
          npm pack --dry-run
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test standalone source on Node 24
        run: |
          node --test
          node cli.mjs --help
          npm pack --dry-run
      - name: Commit verified source and remove temporary import files
        run: |
          git rm --ignore-unmatch .release-source.zip
          git add --all
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish complete v0.2.1 source after Node 22 and 24 verification'
          git push origin HEAD:main
